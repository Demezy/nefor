[package]
name = "nefor-cargo-test-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "nefor-cargo-test-harness"
path = "src/main.rs"
test = false

[dependencies]
serde_json.workspace = true

[features]
full-tests = []

[[test]]
name = "platform_preparation"
path = "tests/platform_preparation.rs"
required-features = ["full-tests"]

[lints.clippy]
pedantic = "warn"
